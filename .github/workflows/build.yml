name: CampusFix CI / CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test Full Stack (Spring Boot + React)
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 17 Development Kit
      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Setup Node.js 20 Environment
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      # 4. Backend: Build and run JUnit 5 tests
      - name: Build Backend & Run JUnit Tests
        run: |
          cd backend
          mvn clean test package -DskipTests=false

      # 5. Frontend: Install dependencies and build React bundle
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Application
        run: |
          cd frontend
          npm run build

      # 6. Status Report
      - name: CI Build Status Report
        if: always()
        run: |
          echo "CampusFix CI Pipeline completed successfully."
          echo "Spring Boot Backend: BUILT & TESTED (JUnit 5 + Mockito)"
          echo "React + Vite Frontend: COMPILED & BUNDLED"
